name: S0-Build Custom Client

on:
  workflow_dispatch:
    inputs:
      rendezvous_server:
        description: 'ID服务器地址'
        required: true
        type: string
      rs_pub_key:
        description: '服务器公钥'
        required: true
        type: string
      api_server:
        description: 'API服务器地址'
        required: false
        default: 'http://admin.rustdesk.com'
        type: string
      default_password:
        description: '默认密码'
        required: false
        default: ''
        type: string
      version_suffix:
        description: '文件名后缀'
        required: false
        default: ''
        type: string
      build_sos_version:
        description: '编译SOS版本'
        required: false
        default: false
        type: boolean

jobs:
  # ==================== Job 1: 生成 tag ====================
  prepare-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - name: Set tag
        id: set-tag
        run: echo "tag_name=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  # ==================== Job 2: 打印配置信息 ====================
  print-config:
    runs-on: ubuntu-latest
    needs: prepare-tag
    steps:
      - name: Print build configuration
        run: |
          echo "=========================================="
          echo "📋 Build Configuration"
          echo "=========================================="
          echo "RENDEZVOUS_SERVER: 已配置"
          echo "RS_PUB_KEY: 已配置"
          echo "API_SERVER: 已配置"
          echo "DEFAULT_PASSWORD: ${{ github.event.inputs.default_password != '' && '已配置' || '未配置' }}"
          echo "CUSTOM_SUFFIX: ${{ github.event.inputs.version_suffix != '' && github.event.inputs.version_suffix || '(无)' }}"
          echo "SOS_MODE: ${{ github.event.inputs.build_sos_version == 'true' && 'Y' || 'N' }}"
          echo "=========================================="
          echo "📦 Upload Tag: ${{ needs.prepare-tag.outputs.tag_name }}"
          echo "=========================================="

  # ==================== Job 3: 编译 ====================
  call-flutter-build:
    needs: [prepare-tag, print-config]
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ needs.prepare-tag.outputs.tag_name }}
    secrets:
      RENDEZVOUS_SERVER: ${{ github.event.inputs.rendezvous_server }}
      RS_PUB_KEY: ${{ github.event.inputs.rs_pub_key }}
      API_SERVER: ${{ github.event.inputs.api_server }}
      DEFAULT_PASSWORD: ${{ github.event.inputs.default_password }}
      CUSTOM_SUFFIX: ${{ github.event.inputs.version_suffix }}
      SOS_MODE: ${{ github.event.inputs.build_sos_version == 'true' && 'Y' || 'N' }}
