name: S00-Generate Custom flutter-build.yml

on:
  workflow_dispatch:

jobs:
  generate-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate flutter-build-custom.yml
        run: |
          # 读取原始文件
          cat .github/workflows/flutter-build.yml > .github/workflows/flutter-build-custom.yml

          # 使用 Python 进行精确插入（避免 YAML 解析器干扰）
          python3 << 'PYTHON_SCRIPT'
          import re
          from pathlib import Path

          file_path = Path('.github/workflows/flutter-build-custom.yml')
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # 修改1：在 upload-tag 后插入 secrets（保留原有内容）
          if 'secrets:' not in content:
              content = re.sub(
                  r'(upload-tag:\s*\n\s*type:\s*string\s*\n\s*default:\s*"[^"]*"\s*)',
                  r'\1    secrets:\n      # ===== 自定义 secrets =====\n      RENDEZVOUS_SERVER:\n        required: false\n      RS_PUB_KEY:\n        required: false\n      API_SERVER:\n        required: false\n      DEFAULT_PASSWORD:\n        required: false\n      RELAY_SERVER:\n        required: false\n      CUSTOM_SUFFIX:\n        required: false',
                  content,
                  flags=re.DOTALL
              )

          # 修改2：在 env: 后插入自定义变量
          env_block = '''  # ===== 自定义环境变量 =====
          RS_PUB_KEY: "\\\${{ secrets.RS_PUB_KEY }}"
          RENDEZVOUS_SERVER: "\\\${{ secrets.RENDEZVOUS_SERVER }}"
          API_SERVER: "\\\${{ secrets.API_SERVER }}"
          DEFAULT_PASSWORD: "\\\${{ secrets.DEFAULT_PASSWORD }}"
          CUSTOM_SUFFIX: "\\\${{ secrets.CUSTOM_SUFFIX }}"'''

          content = re.sub(
              r'^env:',
              f'env:\n{env_block}',
              content,
              flags=re.MULTILINE
          )

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)

          print("✅ flutter-build-custom.yml 已生成")
          PYTHON_SCRIPT

      - name: Upload custom flutter-build file
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-custom
          path: .github/workflows/flutter-build-custom.yml
