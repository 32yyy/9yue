name: S00-Generate Custom flutter-build.yml

on:
  workflow_dispatch:

jobs:
  generate-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate flutter-build-custom.yml
        run: |
          python3 << 'EOF'
          import re
          from pathlib import Path

          original = Path('.github/workflows/flutter-build.yml')
          custom = Path('.github/workflows/flutter-build-custom.yml')

          if not original.exists():
              print("❌ 找不到原始文件")
              exit(1)

          with open(original, 'r', encoding='utf-8') as f:
              content = f.read()

          # 修改1: 添加 secrets
          if 'secrets:' not in content:
              secrets_block = '''    secrets:
          # ===== 自定义 secrets =====
          RENDEZVOUS_SERVER:
            required: false
          RS_PUB_KEY:
            required: false
          API_SERVER:
            required: false
          DEFAULT_PASSWORD:
            required: false
          RELAY_SERVER:
            required: false
          CUSTOM_SUFFIX:
            required: false'''
              content = re.sub(
                  r'(inputs:.*?)(?=\n\s*#|$)',
                  r'\1' + '\n' + secrets_block,
                  content,
                  flags=re.DOTALL
              )

          # 修改2: 添加环境变量
          # 注意：使用 \$ 转义 $，避免 YAML 解析器误认为是模板语法
          env_block = '''  # ===== 自定义环境变量 =====
          RS_PUB_KEY: "\${{ secrets.RS_PUB_KEY }}"
          RENDEZVOUS_SERVER: "\${{ secrets.RENDEZVOUS_SERVER }}"
          API_SERVER: "\${{ secrets.API_SERVER }}"
          DEFAULT_PASSWORD: "\${{ secrets.DEFAULT_PASSWORD }}"
          CUSTOM_SUFFIX: "\${{ secrets.CUSTOM_SUFFIX }}"'''

          if re.search(r'^env:', content, flags=re.MULTILINE):
              content = re.sub(
                  r'^env:',
                  f'env:\n{env_block}',
                  content,
                  flags=re.MULTILINE
              )

          with open(custom, 'w', encoding='utf-8') as f:
              f.write(content)

          print("✅ flutter-build-custom.yml 已生成")
          EOF

      - name: Upload custom flutter-build file
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-custom
          path: .github/workflows/flutter-build-custom.yml
